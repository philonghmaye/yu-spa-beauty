name: Build & Upload iOS to App Store Connect

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install Apple Certificate
        env:
          P12_BASE64: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          echo "Profile UUID: $PP_UUID"
          echo "Profile Name: $PP_NAME"
          
          # DIAGNOSTIC: Show full profile details
          echo "=== PROVISIONING PROFILE DETAILS ==="
          PP_DECODED=$(security cms -D -i $PP_PATH)
          echo "App ID: $(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" /dev/stdin <<< $PP_DECODED)"
          echo "APS Environment: $(/usr/libexec/PlistBuddy -c "Print Entitlements:aps-environment" /dev/stdin <<< $PP_DECODED || echo 'NOT FOUND!')"
          echo "Team ID: $(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /dev/stdin <<< $PP_DECODED)"
          echo "App ID Name: $(/usr/libexec/PlistBuddy -c "Print AppIDName" /dev/stdin <<< $PP_DECODED)"
          echo "Creation Date: $(/usr/libexec/PlistBuddy -c "Print CreationDate" /dev/stdin <<< $PP_DECODED)"
          echo "Expiration Date: $(/usr/libexec/PlistBuddy -c "Print ExpirationDate" /dev/stdin <<< $PP_DECODED)"
          echo "Platform: $(/usr/libexec/PlistBuddy -c "Print Platform:0" /dev/stdin <<< $PP_DECODED || echo 'N/A')"
          echo "Profile Type: $(/usr/libexec/PlistBuddy -c "Print ProvisionsAllDevices" /dev/stdin <<< $PP_DECODED 2>/dev/null && echo 'App Store / Enterprise' || echo 'Development / Ad Hoc')"
          echo "=== END PROFILE DETAILS ==="
          
          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PP_UUID}.mobileprovision

      - name: Setup API Key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          echo "API_KEY_PATH=$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Backup native files before cap sync
        run: |
          echo "=== AppDelegate.swift BEFORE cap sync (full) ==="
          cat ios/App/App/AppDelegate.swift
          echo ""
          echo "=== App.entitlements BEFORE cap sync ==="
          cat ios/App/App/App.entitlements
          echo ""
          echo "=== Info.plist UIBackgroundModes ==="
          grep -A5 "UIBackgroundModes" ios/App/App/Info.plist || echo "UIBackgroundModes NOT FOUND!"
          cp ios/App/App/AppDelegate.swift /tmp/AppDelegate.swift.bak
          cp ios/App/App/App.entitlements /tmp/App.entitlements.bak
          cp ios/App/App/Info.plist /tmp/Info.plist.bak

      - name: Build web & sync Capacitor
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head></head><body></body></html>' > out/index.html
          npx cap sync ios

      - name: Check and restore native files after cap sync
        run: |
          echo "=== Checking if cap sync modified AppDelegate ==="
          if diff ios/App/App/AppDelegate.swift /tmp/AppDelegate.swift.bak > /dev/null 2>&1; then
            echo "✅ AppDelegate.swift was NOT modified by cap sync"
          else
            echo "⚠️ AppDelegate.swift WAS MODIFIED by cap sync! Restoring..."
            cp /tmp/AppDelegate.swift.bak ios/App/App/AppDelegate.swift
            echo "✅ Restored original AppDelegate.swift"
          fi
          
          if diff ios/App/App/App.entitlements /tmp/App.entitlements.bak > /dev/null 2>&1; then
            echo "✅ App.entitlements was NOT modified by cap sync"
          else
            echo "⚠️ App.entitlements WAS MODIFIED by cap sync! Restoring..."
            cp /tmp/App.entitlements.bak ios/App/App/App.entitlements
            echo "✅ Restored original App.entitlements"
          fi
          
          if diff ios/App/App/Info.plist /tmp/Info.plist.bak > /dev/null 2>&1; then
            echo "✅ Info.plist was NOT modified by cap sync"
          else
            echo "⚠️ Info.plist WAS MODIFIED by cap sync! Restoring..."
            cp /tmp/Info.plist.bak ios/App/App/Info.plist
            echo "✅ Restored original Info.plist"
          fi
          
          echo ""
          echo "=== UIBackgroundModes in FINAL Info.plist ==="
          grep -A5 "UIBackgroundModes" ios/App/App/Info.plist || echo "UIBackgroundModes MISSING!"
          echo ""
          echo "=== AppDelegate.swift FINAL (first 30 lines) ==="
          head -30 ios/App/App/AppDelegate.swift

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Configure signing for App target
        run: |
          cd ios/App
          # Set manual signing ONLY for App target in pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = G66VK49BR8;/DEVELOPMENT_TEAM = G66VK49BR8;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "'"$PP_NAME"'";/g' App.xcodeproj/project.pbxproj

      - name: Verify entitlements before build
        run: |
          echo "=== App.entitlements ==="
          cat ios/App/App/App.entitlements
          echo ""
          echo "=== AppDelegate.swift (first 20 lines) ==="
          head -20 ios/App/App/AppDelegate.swift
          echo ""
          echo "=== CODE_SIGN_ENTITLEMENTS in pbxproj ==="
          grep -n "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj || echo "NOT FOUND!"
          echo ""
          echo "=== Provisioning Profile entitlements ==="
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          security cms -D -i $PP_PATH | grep -A5 "aps-environment" || echo "aps-environment NOT in profile!"

      - name: Build iOS Archive
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates

      - name: Verify entitlements in archive
        run: |
          echo "=== Embedded entitlements in .app ==="
          codesign -d --entitlements :- "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" 2>/dev/null || echo "Failed to read entitlements"
          echo ""
          echo "=== Provisioning profile in .app ==="
          security cms -D -i "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/embedded.mobileprovision" 2>/dev/null | grep -A3 "aps-environment" || echo "No aps-environment in embedded profile"
          echo ""
          echo "=== BINARY STRING CHECK: Is our custom code compiled? ==="
          BINARY="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/App"
          echo "Binary size: $(wc -c < $BINARY) bytes"
          echo "Checking for custom strings..."
          strings $BINARY | grep -i "AppDelegate TEST" && echo "✅ FOUND: AppDelegate TEST" || echo "❌ NOT FOUND: AppDelegate TEST"
          strings $BINARY | grep -i "REGISTER_NOW" && echo "✅ FOUND: REGISTER_NOW" || echo "❌ NOT FOUND: REGISTER_NOW"
          strings $BINARY | grep -i "registerForRemoteNotifications" && echo "✅ FOUND: registerForRemoteNotifications" || echo "❌ NOT FOUND: registerForRemoteNotifications"
          strings $BINARY | grep -i "TOKEN_OK" && echo "✅ FOUND: TOKEN_OK" || echo "❌ NOT FOUND: TOKEN_OK"
          strings $BINARY | grep -i "TOKEN_FAIL" && echo "✅ FOUND: TOKEN_FAIL" || echo "❌ NOT FOUND: TOKEN_FAIL"
          strings $BINARY | grep -i "PUSH-NATIVE" && echo "✅ FOUND: PUSH-NATIVE" || echo "❌ NOT FOUND: PUSH-NATIVE"
          strings $BINARY | grep -i "Build 16" && echo "✅ FOUND: Build 16 reference" || echo "❌ NOT FOUND: Build 16 reference"
          echo ""
          echo "=== ALL Swift/Capacitor related strings ==="
          strings $BINARY | grep -iE "(push|notif|register|token|delegate)" | head -30

      - name: Export IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -allowProvisioningUpdates

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -rf ~/private_keys 2>/dev/null || true
