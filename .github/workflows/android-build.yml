name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy web assets (lightweight)
        run: |
          mkdir -p out
          echo '<html><body>Loading...</body></html>' > out/index.html
          npx cap copy android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate release keystore
        run: |
          keytool -genkey -v \
            -keystore android/yurispa-release.keystore \
            -alias yurispa \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass yurispa2026 -keypass yurispa2026 \
            -dname "CN=Yuri Spa Beauty, OU=Mobile, O=Yuri Spa, L=Ha Tien, ST=Kien Giang, C=VN"

      - name: Build Release AAB (for Google Play)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Build Release APK (for testing)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
